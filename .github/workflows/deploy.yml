name: Ingesta y despliegue

on:
  schedule:
    # Nunca en los minutos 0 y 30: GitHub avisa de que el comienzo de cada hora es de alta carga y de
    # que, con mucha carga, se pueden descartar ejecuciones en cola. Base: cada media hora, en los
    # minutos 17 y 47. La fecha de los datos que muestra la web es siempre la de la consulta.
    - cron: '17,47 * * * *'
    # Más densa alrededor de la medianoche de Madrid (por si las gasolineras cambian ahí sus
    # precios; sin verificar): cada 10 minutos, de 23:33 a 01:23 hora de Madrid. Con `timezone`
    # el horario de verano e invierno lo resuelve GitHub.
    - cron: '33,43,53 23 * * *'
      timezone: 'Europe/Madrid'
    - cron: '3,13,23,33,43,53 0 * * *'
      timezone: 'Europe/Madrid'
    - cron: '3,13,23 1 * * *'
      timezone: 'Europe/Madrid'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita solapes entre ejecuciones; no cancela un despliegue en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GASORA_BASE: /${{ github.event.repository.name }}/
      # Último dato publicado: respaldo si la API del Ministerio falla (sección 5.3 del plan).
      GASORA_PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Si no hay datos válidos ni respaldo, falla aquí y la web sigue con el último despliegue bueno.
      - run: npm run ingest
      - run: npm run check:data
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
