name: Ingesta y despliegue

on:
  schedule:
    # Nunca en los minutos 0 y 30: GitHub avisa de que el comienzo de cada hora es de alta carga y de
    # que, con mucha carga, se pueden descartar ejecuciones en cola. Base: cada media hora, en los
    # minutos 17 y 47. Si los datos no han cambiado, la ejecución se omite (ver `compare:published`).
    - cron: '17,47 * * * *'
    # Más densa alrededor de la medianoche de Madrid (por si las gasolineras cambian ahí sus
    # precios; sin verificar): cada 10 minutos, de 23:33 a 01:23 hora de Madrid. Con `timezone`
    # el horario de verano e invierno lo resuelve GitHub.
    - cron: '33,43,53 23 * * *'
      timezone: 'Europe/Madrid'
    - cron: '3,13,23,33,43,53 0 * * *'
      timezone: 'Europe/Madrid'
    - cron: '3,13,23 1 * * *'
      timezone: 'Europe/Madrid'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Compilar y desplegar aunque los datos publicados ya sean iguales'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Evita solapes entre ejecuciones; no cancela un despliegue en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # «false» solo si la comprobación dice que no hay nada nuevo; en cualquier otro caso, se despliega
      deploy: ${{ steps.compare.outputs.deploy != 'false' }}
    env:
      # Dominio propio (gasora.es): la web vive en la raíz, no en /<repo>/
      GASORA_BASE: /
      GASORA_SITE: https://gasora.es/
      # Último dato publicado: respaldo si la API del Ministerio falla (sección 5.3 del plan).
      GASORA_PREVIOUS_URL: https://gasora.es/data/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Si no hay datos válidos ni respaldo, falla aquí y la web sigue con el último despliegue bueno.
      - run: npm run ingest
      - run: npm run check:data
      # Compara lo ingerido con lo que sirve GitHub Pages. Se omite compilar y desplegar solo en
      # schedule o workflow_dispatch (sin force) con datos y código publicados iguales. Falla abierto:
      # si esta comprobación se rompe o no puede leer lo publicado, se despliega.
      - id: compare
        continue-on-error: true
        env:
          SITE_URL: https://gasora.es/
          FORCE: ${{ inputs.force }}
        run: npm run compare:published
      - if: steps.compare.outputs.deploy != 'false'
        run: npm test
      - if: steps.compare.outputs.deploy != 'false'
        run: npm run build
      - if: steps.compare.outputs.deploy != 'false'
        run: npm run check:build
      - if: steps.compare.outputs.deploy != 'false'
        uses: actions/configure-pages@v6
      - if: steps.compare.outputs.deploy != 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
