name: CI

on:
  # También en main: el usuario sube directamente a main y, si no, la calidad no se comprueba
  # (el despliegue no ejecuta los tests).
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # La CI no depende del Ministerio: usa la muestra de fixtures/ (datos de demostración).
      - run: npm run ingest:fixtures
      - run: npm run check:data
      # El build de producción no debe llevar la galería /ui-kit (los e2e usan un build aparte).
      - run: npm run build
      - run: npm run check:build
      # Chromium para todo; Firefox y WebKit para layout, accesibilidad y teclado
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  # Prueba contra los servidores reales de OpenFreeMap (estilos y atribución). Aparte y sin bloquear:
  # si ese servicio externo falla o va lento, la integración no se rompe.
  map-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live
